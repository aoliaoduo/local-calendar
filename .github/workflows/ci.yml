name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Verify Electron binary
        shell: pwsh
        run: |
          $electron = Join-Path (Resolve-Path 'node_modules/electron') 'dist/electron.exe'
          if (-not (Test-Path -LiteralPath $electron)) {
            throw "Electron binary is missing: $electron"
          }
          & $electron --version
      - run: npm run typecheck
      - run: npm test
